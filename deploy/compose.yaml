name: escada
services:
  database:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: escada
      POSTGRES_DB: escada
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run configure first}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U escada -d escada']
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      DATABASE_URL: postgresql://escada:${DB_PASSWORD}@database:5432/escada
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3100}
      HOST: 0.0.0.0
      PORT: 3100
      SESSION_SECRET: ${SESSION_SECRET:?Run configure first}
      MESSAGE_KEY: ${MESSAGE_KEY:?Run configure first}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Run configure first}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Run configure first}
      WA_AUTH_DIR: /app/server/.session
      WA_AUTO_CONNECT: ${WA_AUTO_CONNECT:-false}
    ports:
      - '${APP_BIND:-127.0.0.1}:3100:3100'
    volumes:
      - whatsapp_session:/app/server/.session
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, 'fetch("http://127.0.0.1:3100/api/health").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped
volumes:
  postgres_data:
  whatsapp_session:
